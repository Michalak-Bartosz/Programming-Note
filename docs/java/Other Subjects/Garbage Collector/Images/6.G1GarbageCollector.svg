div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(57.28125, 521)" id="flowchart-G-332" class="node default"><circle cy="0" cx="0" r="49.28125" style="fill:#008c31 !important;stroke-width:0.2rem !important" class="basic label-container"></circle><g transform="translate(-41.78125, -24)" style="font-size:1rem !important" class="label"><rect></rect><foreignObject height="48" width="83.5625"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 1rem !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="font-size:1rem !important"><p>G1 Garbage<br/>Collector</p></span></div></foreignObject></g></g><g transform="translate(296.5625, 439)" id="flowchart-A1-334" class="node default"><rect height="126" width="230" y="-63" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -48)" style="" class="label"><rect></rect><foreignObject height="96" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Designed for applications running on multi-processor machines with large memory space</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(296.5625, 603)" id="flowchart-N1-336" class="node default"><rect height="102" width="230" y="-51" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Available from the JDK7 Update 4 and in later releases.</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(296.5625, 227)" id="flowchart-N2-338" class="node default"><rect height="54" width="129.4791717529297" y="-27" x="-64.73958587646484" ry="5" rx="5" style="fill:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-49.739585876464844, -12)" style="" class="label"><rect></rect><foreignObject height="24" width="99.47917175292969"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Steps of cycle</p></span></div></foreignObject></g></g><g transform="translate(296.5625, 755)" id="flowchart-C1-340" class="node default"><rect height="102" width="230" y="-51" x="-115" ry="5" rx="5" style="stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>JVM Argument:</strong></ins><br/>java -XX:+UseG1GC -jar Application.java</p></span></div></foreignObject></g></g><g transform="translate(576.5625, 154)" id="flowchart-N21-342" class="node default"><rect height="126" width="230" y="-63" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -48)" style="" class="label"><rect></rect><foreignObject height="96" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>G1 partitions the heap into a set of equal-sized heap regions, each a contiguous range of virtual memory</p></span></div></foreignObject></g></g><g transform="translate(856.5625, 154)" id="flowchart-N22-344" class="node default"><rect height="174" width="230" y="-87" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>G1 shows a concurrent global marking phase<br/>(i.e. phase 1, known as <strong>Marking</strong>) to determine the liveness of objects throughout the heap.</p></span></div></foreignObject></g></g><g transform="translate(1136.5625, 154)" id="flowchart-N23-346" class="node default"><rect height="222" width="230" y="-111" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -96)" style="" class="label"><rect></rect><foreignObject height="192" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>G1 knows which regions are mostly empty. It collects in these areas first, which usually yields a significant amount of free space<br/>(i.e. phase 2, known as <strong>Sweeping</strong>)</p></span></div></foreignObject></g></g><g transform="translate(1360.3385429382324, 227)" id="flowchart-N24-348" class="node default"><rect height="54" width="117.55208587646484" y="-27" x="-58.77604293823242" ry="5" rx="5" style="fill:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-43.77604293823242, -12)" style="" class="label"><rect></rect><foreignObject height="24" width="87.55208587646484"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>End of cycle</p></span></div></foreignObject></g></g></g></g></g><text class="flowchartTitleText" y="-25" x="726.0573120117188">G1 Garbage Collector (Garbage First)</text></svg>