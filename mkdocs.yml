site_name: Programming Notes
site_description: A comprehensive collection of programming notes and best practices
site_author: Michalak-Bartosz
site_url: https://michalak-bartosz.github.io/Programming-Note/

# Repository
repo_name: Programming-Note
repo_url: https://github.com/Michalak-Bartosz/Programming-Note
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant # Instant loading
    - navigation.tracking # Anchor tracking
    - navigation.tabs # Top-level sections in tabs
    - navigation.tabs.sticky # Keep tabs visible when scrolling
    - navigation.indexes # Section index pages
    - navigation.top # Back to top button
    - search.suggest # Search suggestions
    - search.highlight # Highlight search terms
    - search.share # Share search results
    - content.code.copy # Copy code blocks
    - content.code.annotate # Code annotations

  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - awesome-pages
  - minify:
      minify_html: true

# Additional CSS
extra_css:
  - stylesheets/extra.css

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Michalak-Bartosz
  generator: false

# Navigation will be automatically generated by awesome-pages plugin
# You can customize it by creating .pages files in each directory

# Copyright footer
copyright: A comprehensive collection of programming notes and best practices.
