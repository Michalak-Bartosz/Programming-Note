site_name: Programming Notes
site_description: A comprehensive collection of programming notes and best practices
site_author: Michalak-Bartosz
site_url: https://michalak-bartosz.github.io/Programming-Note/

# Repository
repo_name: Programming-Note
repo_url: https://github.com/Michalak-Bartosz/Programming-Note
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "#595C60"
      accent: "#7E8287"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "#333638"
      accent: "#6C6F74"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant # Instant loading
    - navigation.tracking # Anchor tracking
    - navigation.tabs # Top-level sections in tabs
    - navigation.tabs.sticky # Keep tabs visible when scrolling
    - navigation.indexes # Section index pages
    - navigation.top # Back to top button
    - search.suggest # Search suggestions
    - search.highlight # Highlight search terms
    - search.share # Share search results
    - content.code.copy # Copy code blocks
    - content.code.annotate # Code annotations

  icon:
    repo: "fontawesome/brands/github"

  # favicon will be handled dynamically by JavaScript
  logo: "assets/images/dark_logo.png"

# Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - footnotes
  - attr_list
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - awesome-pages
  - mermaid2:
  - panzoom:
      full_screen: true
  - minify:
      minify_html: true
  - tags:
      tags_hierarchy: true
      tags_sort_by: !!python/name:custom_sort.tag_name_natural
      listings_sort_by: !!python/name:custom_sort.item_title_natural

# Additional CSS
extra_css:
  - stylesheets/style.css
  - stylesheets/header.css

# Additional JavaScript
extra_javascript:
  - assets/javascripts/theme-favicon.js

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Michalak-Bartosz
  generator: false

# Copyright footer
copyright: Copyright © 2025 Michalak-Bartosz | <strong>Programming-Note</strong> | A comprehensive collection of programming notes and best practices.
