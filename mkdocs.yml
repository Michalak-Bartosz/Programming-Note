# =============================================================================
#  Site Identity & Metadata
# =============================================================================
site_name: Programming Notes            # Display name in the header and browser title
site_description: A comprehensive collection of programming notes and best practices
site_author: Michalak-Bartosz
site_url: https://michalak-bartosz.github.io/Programming-Note/

# =============================================================================
#  Repository Integration (edit/view on GitHub straight from the docs)
# =============================================================================
repo_name: Programming-Note
repo_url: https://github.com/Michalak-Bartosz/Programming-Note
edit_uri: edit/main/docs/

# =============================================================================
#  Material Theme (colors, icons, navigation helpers)
# =============================================================================
theme:
  name: material
  language: en                       # Localized strings for built-in UI labels
  palette:
    # Light mode palette (default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "#3D5A80"
      accent: "#EE6C4D"
    # Dark mode palette
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "#5F7485"
      accent: "#8FBDD3"

  features:
    - navigation.instant             # Prefetch next page for snappier feel
    - navigation.tracking            # Highlight section currently in view
    - navigation.tabs                # Top-level sections rendered as tabs
    - navigation.tabs.sticky         # Tabs remain visible while scrolling
    - navigation.indexes             # Auto-generated index pages for folders
    - navigation.top                 # Back-to-top floating button
    - search.suggest                 # Autocomplete results in search bar
    - search.highlight               # Highlight query within documents
    - search.share                   # Copyable search URLs
    - content.code.copy              # Copy-to-clipboard button on code blocks
    - content.code.annotate          # Numbered code annotations

  code:
    highlight_theme: dracula         # Apply Dracula palette to fenced code blocks
    line_numbers: true               # Show line numbers for plain fenced code

  icon:
    repo: "fontawesome/brands/github"  # GitHub logo for repo button

  favicon: "assets/images/dark_logo.png"
  logo: "assets/images/dark_logo.png"

# =============================================================================
#  Markdown Extensions (syntax sugar enabled in every page)
# =============================================================================
markdown_extensions:
  - toc:
      permalink: true               # Add ¶ anchor copy link per heading
      toc_depth: 3                  # Include headings up to H3
  - admonition                      # Adds !!! note/warning blocks
  - footnotes                       # Markdown footnote syntax
  - attr_list                       # Attribute lists on inline elements
  - def_list                        # Definition list support
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid             # Render ```mermaid``` diagrams
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true         # Linkable line numbers
      line_spans: __span            # Allow inline styling of highlighted lines
      pygments_lang_class: true     # Add language class to code element
  - pymdownx.tasklist:
      custom_checkbox: true         # Replaces bullets with GitHub-style checkboxes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# =============================================================================
#  Plugins (grouped by purpose for readability)
# =============================================================================
plugins:
  # --- Navigation & discovery ---
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - awesome-pages                   # Read structure from .pages files instead of static nav

  # --- Content metadata & taxonomy ---
  - git-revision-date-localized:
      enable_creation_date: true    # Display created+updated timestamps in page meta
      type: date
  - tags:
      listings: true                # Generate /tags/ listing pages
      tags_hierarchy: true          # Nest tag families automatically
#      tags_allowed:
#        - java
#        - jdk-8
#        - platform

  # --- Rich media & interaction ---
  - mermaid2:                       # Server-side rendering of Mermaid diagrams
  - panzoom:
      full_screen: true             # Allow zooming diagrams/fullscreen images

  # --- Performance tweaks ---
  - minify:
      minify_html: true             # Shrink generated HTML for faster delivery

# =============================================================================
#  Assets (custom CSS/JS layered on top of Material theme)
# =============================================================================
extra_css:
  - assets/stylesheets/style.css
  - assets/stylesheets/header.css

extra_javascript:
  - assets/javascripts/theme-favicon.js
  - assets/javascripts/tags-directory-enhancer.js
  - assets/javascripts/theme-picker.js

# =============================================================================
#  Miscellaneous UI Extras (social links, footer, generator toggle)
# =============================================================================
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Michalak-Bartosz
  generator: false                 # Hide “Made with MkDocs” footer badge

copyright: |
  Copyright © 2025 Michalak-Bartosz
  <strong>Programming-Note</strong>
  A comprehensive collection of programming notes and best practices.
