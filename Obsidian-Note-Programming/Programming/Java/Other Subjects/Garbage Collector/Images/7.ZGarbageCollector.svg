e: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>ENABLE ZGC</p></span></div></foreignObject></g></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g transform="translate(313.5364685058594, 108.5)" id="flowchart-C1-39689" class="node default"><rect height="102" width="541.0729370117188" y="-51" x="-270.5364685058594" ry="5" rx="5" style="stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-255.53646850585938, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="511.07293701171875"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>JDK versions lower than 15<br/>JVM Argument:</strong></ins><br/><span style="white-space: nowrap">java -XX:+UnlockExperimentalVMOptions -XX:+UseZGC Application.java</span></p></span></div></foreignObject></g></g><g transform="translate(773.8229370117188, 108.5)" id="flowchart-C2-39690" class="node default"><rect height="126" width="279.5" y="-63" x="-139.75" ry="5" rx="5" style="stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-124.75, -48)" style="" class="label"><rect></rect><foreignObject height="96" width="249.5"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>From version 15 on, we don’t need experimental mode on<br/>JVM Argument:</strong></ins><br/><span style="white-space: nowrap">java -XX:+UseZGC Application.java</span></p></span></div></foreignObject></g></g></g></g><g transform="translate(263.39583587646484, 323)" class="root"><g class="clusters"><g data-look="classic" id="FEATURE" class="cluster"><rect height="321" width="860" y="8" x="8" style=""></rect><g transform="translate(406.796875, 8)" class="cluster-label"><foreignObject height="24" width="62.40625"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>FEATURE</p></span></div></foreignObject></g></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g transform="translate(158, 168.5)" id="flowchart-N1-39686" class="node default"><rect height="102" width="230" y="-51" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>ZGC has obtained the production status from Java 15 onwards</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(438, 168.5)" id="flowchart-N2-39687" class="node default"><rect height="246" width="230" y="-123" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -108)" style="" class="label"><rect></rect><foreignObject height="216" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Reference colored pointers are the core concept of ZGC.</strong></ins> It means that ZGC uses some metadata bits of reference to mark the state of the object. It also handles heaps ranging <ins>from 8MB to 16TB in size.</ins></p></span></div></foreignObject></g></g><g transform="translate(718, 168.5)" id="flowchart-N3-39688" class="node default"><rect height="102" width="230" y="-51" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Pause times don’t increase with the heap, live-set, or root-set size.</p></span></div></foreignObject></g></g></g></g><g transform="translate(123.39583587646484, 0)" class="root"><g class="clusters"><g data-look="classic" id="ADVANTAGES" class="cluster"><rect height="273" width="1140" y="8" x="8" style=""></rect><g transform="translate(532.5364570617676, 8)" class="cluster-label"><foreignObject height="24" width="90.92708587646484"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>ADVANTAGES</p></span></div></foreignObject></g></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g transform="translate(158, 144.5)" id="flowchart-A1-39682" class="node default"><rect height="78" width="230" y="-39" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -24)" style="" class="label"><rect></rect><foreignObject height="48" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Scalable and low-latency garbage collector</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(438, 144.5)" id="flowchart-A2-39683" class="node default"><rect height="150" width="230" y="-75" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Similar to G1, Z Garbage Collector partitions the heap, except that<br/><ins><strong>heap regions can have different sizes.</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(718, 144.5)" id="flowchart-A3-39684" class="node default"><rect height="198" width="230" y="-99" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -84)" style="" class="label"><rect></rect><foreignObject height="168" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>ZGC works without stopping the execution of application threads for <ins><strong>more than 10 ms</strong></ins>, which makes it suitable for applications that require low latency.</p></span></div></foreignObject></g></g><g transform="translate(998, 144.5)" id="flowchart-A4-39685" class="node default"><rect height="198" width="230" y="-99" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -84)" style="" class="label"><rect></rect><foreignObject height="168" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>It uses load barriers with colored pointers to perform concurrent operations when the threads are running, and they’re used to keep track of heap usage.</p></span></div></foreignObject></g></g></g></g><g transform="translate(44.69791793823242, 491.5)" id="flowchart-G-39681" class="node default"><circle cy="0" cx="0" r="36.69791793823242" style="fill:#008c31 !important;stroke-width:0.2rem !important" class="basic label-container"></circle><g transform="translate(-29.197917938232422, -24)" style="font-size:2rem !important" class="label"><rect></rect><foreignObject height="48" width="58.395835876464844"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 2rem !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="font-size:2rem !important"><p>ZGC</p></span></div></foreignObject></g></g></g></g></g><text class="flowchartTitleText" y="-25" x="639.6979370117188">Z Garbage Collector (ZGC)</text></svg>