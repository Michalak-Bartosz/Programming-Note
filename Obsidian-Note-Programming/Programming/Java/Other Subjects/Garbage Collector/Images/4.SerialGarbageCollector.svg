 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(535.5, 67.83854293823242)" id="flowchart-G-64" class="node default"><circle cy="0" cx="0" r="59.83854293823242" style="fill:#008c31 !important;stroke-width:0.2rem !important" class="basic label-container"></circle><g transform="translate(-52.33854293823242, -24)" style="font-size:1rem !important" class="label"><rect></rect><foreignObject height="48" width="104.67708587646484"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 1rem !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="font-size:1rem !important"><p>Serial Garbage<br/>Collector</p></span></div></foreignObject></g></g><g transform="translate(119.25, 252.67708587646484)" id="flowchart-A1-66" class="node default"><rect height="78" width="222.5" y="-39" x="-111.25" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-96.25, -24)" style="" class="label"><rect></rect><foreignObject height="48" width="192.5"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Simplest implementation.</strong></ins><br/>Works with a single thread</p></span></div></foreignObject></g></g><g transform="translate(395.5, 252.67708587646484)" id="flowchart-D1-68" class="node default"><rect height="150" width="230" y="-75" x="-115" ry="5" rx="5" style="stroke:#a81f00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>Freezes all application threads when it runs.</strong></ins><br/>It's not good idea to use it with multi-threaded apps, like server environments</p></span></div></foreignObject></g></g><g transform="translate(675.5, 252.67708587646484)" id="flowchart-N1-70" class="node default"><rect height="150" width="230" y="-75" x="-115" ry="5" rx="5" style="stroke:#0089a8 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Good choice <ins><strong>for most applications that don’t have small pause time requirements and run on client-style machines.</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(955.5, 252.67708587646484)" id="flowchart-C1-72" class="node default"><rect height="102" width="230" y="-51" x="-115" ry="5" rx="5" style="stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p><ins><strong>JVM Argument:</strong></ins><br/>java -XX:+UseSerialGC -jar Application.java</p></span></div></foreignObject></g></g></g></g></g><text class="flowchartTitleText" y="-25" x="539.25">Serial Garbage Collector</text></svg>