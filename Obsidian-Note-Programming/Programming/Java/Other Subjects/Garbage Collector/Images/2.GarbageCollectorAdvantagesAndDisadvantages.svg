arker-end="url(#graph-div_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_D_D3_7" d="M1455.692,167.781L1466.91,171.948C1478.128,176.115,1500.564,184.448,1511.782,195.698C1523,206.948,1523,221.115,1523,234.615C1523,248.115,1523,260.948,1523,267.365L1523,273.781"></path><path marker-end="url(#graph-div_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_D_D4_8" d="M1463.573,150.724L1520.377,157.733C1577.181,164.743,1690.788,178.762,1747.592,191.855C1804.396,204.948,1804.396,217.115,1804.396,228.615C1804.396,240.115,1804.396,250.948,1804.396,256.365L1804.396,261.781"></path></g><g class="edgeLabels"><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(963, 35.890625)" id="flowchart-G-190" class="node default"><circle cy="0" cx="0" r="27.890625" style="fill:#008c31 !important;stroke-width:0.2rem !important" class="basic label-container"></circle><g transform="translate(-20.390625, -24)" style="font-size:2rem !important" class="label"><rect></rect><foreignObject height="48" width="40.78125"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 2rem !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="font-size:2rem !important"><p>GC</p></span></div></foreignObject></g></g><g transform="translate(403, 140.78125)" id="flowchart-A-191" class="node default"><rect height="54" width="141.3229217529297" y="-27" x="-70.66146087646484" style="fill:#2eab00 !important" class="basic label-container"></rect><g transform="translate(-40.661460876464844, -12)" style="" class="label"><rect></rect><foreignObject height="24" width="81.32292175292969"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Advantages</p></span></div></foreignObject></g></g><g transform="translate(1383, 140.78125)" id="flowchart-D-193" class="node default"><rect height="54" width="161.14583587646484" y="-27" x="-80.57291793823242" style="fill:#a81f00 !important" class="basic label-container"></rect><g transform="translate(-50.57291793823242, -12)" style="" class="label"><rect></rect><foreignObject height="24" width="101.14583587646484"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Disadvantages</p></span></div></foreignObject></g></g><g transform="translate(123, 352.78125)" id="flowchart-A1-195" class="node default"><rect height="174" width="230" y="-87" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>No manual memory allocation/deallocation handling because unused memory space is automatically handled by GC</p></span></div></foreignObject></g></g><g transform="translate(403, 352.78125)" id="flowchart-A2-197" class="node default"><rect height="78" width="230" y="-39" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -24)" style="" class="label"><rect></rect><foreignObject height="48" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>No overhead of handling Dangling Pointer</p></span></div></foreignObject></g></g><g transform="translate(683, 352.78125)" id="flowchart-A3-199" class="node default"><rect height="198" width="230" y="-99" x="-115" ry="5" rx="5" style="stroke:#2eab00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -84)" style="" class="label"><rect></rect><foreignObject height="168" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Automatic Memory Leak management - GC on its own can’t guarantee the full proof solution to memory leaking; however, it takes care of a good portion of it</p></span></div></foreignObject></g></g><g transform="translate(963, 352.78125)" id="flowchart-D1-201" class="node default"><rect height="270" width="230" y="-135" x="-115" ry="5" rx="5" style="stroke:#a81f00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -120)" style="" class="label"><rect></rect><foreignObject height="240" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Since JVM has to keep track of object reference creation/deletion, this activity requires <br/><ins><strong>MORE CPU POWER</strong></ins> than the original application. It may affect the performance of requests which <br/><ins><strong>REQUIRE LARGE MEMORY</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(1243, 352.78125)" id="flowchart-D2-203" class="node default"><rect height="174" width="230" y="-87" x="-115" ry="5" rx="5" style="stroke:#a81f00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Programmers have <br/><ins><strong>NO CONTROL OVER THE SCHEDULING OF CPU TIME</strong></ins> dedicated to freeing objects that are no longer needed</p></span></div></foreignObject></g></g><g transform="translate(1523, 352.78125)" id="flowchart-D3-205" class="node default"><rect height="150" width="230" y="-75" x="-115" ry="5" rx="5" style="stroke:#a81f00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Using some GC implementations might result in the <br/><ins><strong>APPLICATION STOPPING UNPREDICTABLY</strong></ins></p></span></div></foreignObject></g></g><g transform="translate(1804.3958358764648, 352.78125)" id="flowchart-D4-207" class="node default"><rect height="174" width="232.7916717529297" y="-87" x="-116.39583587646484" ry="5" rx="5" style="stroke:#a81f00 !important;stroke-width:0.2rem !important" class="basic label-container"></rect><g transform="translate(-101.39583587646484, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="202.7916717529297"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Automatized memory management would <br/><ins><strong>NOT BE AS EFFICIENT AS THE PROPER MANUAL MEMORY ALLOCATION/DELLOCATION</strong></ins></p></span></div></foreignObject></g></g></g></g></g><text class="flowchartTitleText" y="-25" x="964.3958129882812">Garbage Collector (GC) advantages and disadvantages</text></svg>